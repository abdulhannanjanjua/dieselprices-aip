name: Update diesel prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_diesel_prices.py
      - name: Commit updated diesel data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update AIP retail diesel prices
          file_pattern: data/diesel_weekly_prices.csv data/diesel_weekly_prices.xlsx
